<text x="86" y="680" font-size="12" fill="#172B33">version, page, blocs et révision : le lecteur ouvre et surligne</text>
<text x="24" y="738" font-size="12" fill="#4A5961">Trait plein : requête · tirets : réponse ou événement SSE.</text>
<text x="24" y="756" font-size="12" fill="#4A5961">Chaque requête du navigateur porte le cookie de session (W011) ; sans session valide, 401 avant toute recherche.</text>
<text x="24" y="774" font-size="12" fill="#4A5961">Refus d'admission à l'échéance : événement error resource_admission_denied, modèle non appelé.</text>
<text x="24" y="792" font-size="12" fill="#4A5961">Une réponse ne cite que des IDs du registre de la question ; le clic relit le registre avant d'ouvrir le document.</text>
