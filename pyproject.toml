[project]
name = "agentragpdf"
version = "0.1.0"
description = "Poste documentaire PDF local, Windows x86-64 et Linux (aarch64, x86-64) natifs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.1",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "PyYAML==6.0.3",
  "psutil==7.2.2",
  "pywin32==312; sys_platform == 'win32'",
  "numpy>=2.0,<3",
  "onnxruntime==1.30.0",
  "tokenizers==0.23.2",
  "docling==2.131.0",
  "pypdfium2==5.13.0",
  "Pillow>=12.0,<13",
  "huggingface-hub>=0.36,<3",
  "transformers>=4.56,<6",
  "onnx==1.23.1",
  # Importés directement par services/ (inspection du 01/10, C9) ; versions déjà résolues par Docling et FastAPI.
  "docling-core==2.99.0",
  # Adaptateurs Office natifs : versions déjà présentes dans le verrou Docling.
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "lxml==6.1.3",
  "defusedxml==0.7.1",
  "jinja2==3.1.6",
  "pandas==3.0.6",
  "scipy==1.18.1",
  "starlette==1.7.0",
  # torch et torchvision viennent de Docling ; déclarés dans project.dependencies, comme le guide PyTorch d'uv
  # le prescrit pour un paquet tiré d'un index par [tool.uv.sources] (source CPU sous Linux, PyPI sous Windows).
  "torch==2.14.0",
  "torchvision==0.29.0",
  # Archive officielle d'Ollama pour Linux arm64 en .tar.zst (W018) ; décompressée par le provisionnement.
  "zstandard==0.25.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio>=1.0,<2", "ruff==0.16.9", "mypy==2.3.1", "reportlab==5.0.1"]

[tool.uv]
package = false
environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Windows : roues PyPI (CPU seul pour win_amd64). Linux : la roue PyPI tire CUDA 13 ; la variante +cpu vient de l'index officiel PyTorch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: services natifs réels et racines isolées",
  "acceptance: recette réelle, modèles provisionnés et mesures sur le poste cible",
  "slow: travail lourd nécessitant un créneau de ressources",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
files = ["services", "tools/qualification", "tools/corpus", "tools/dist", "RAG_Local_Agents/tools"]
# Lancer mypy depuis la racine : elle sert de base aux paquets (services.*, tools.corpus.*).
# Les scripts de tools/qualification et RAG_Local_Agents/tools s'importent entre eux par
# leur nom court (dossier du script dans sys.path) : ces dossiers sont donc des bases.
explicit_package_bases = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR/tools/qualification", "$MYPY_CONFIG_FILE_DIR/RAG_Local_Agents/tools"]

[[tool.mypy.overrides]]
# http_guards.py importe evidence_io par son chemin de paquet ; le module est déjà vérifié
# sous son nom court, et le suivre une seconde fois ferait voir le même fichier sous deux noms.
module = ["tools.qualification.*"]
follow_imports = "skip"
